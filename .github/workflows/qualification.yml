name: Qualification

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  qualify:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.85.0"
          - stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
          rustup component add clippy --toolchain "${{ matrix.toolchain }}"
          rustup override set "${{ matrix.toolchain }}"

      - name: Check default features
        run: cargo check --locked --all-targets

      - name: Test default features
        run: cargo test --locked --all-targets

      - name: Doctest default features
        run: cargo test --locked --doc

      - name: Clippy default features
        run: cargo clippy --locked --all-targets

      - name: Documentation default features
        run: cargo doc --locked --no-deps

      - name: Check all features
        run: cargo check --locked --all-targets --all-features

      - name: Test all features
        run: cargo test --locked --all-targets --all-features

      - name: Doctest all features
        run: cargo test --locked --doc --all-features

      - name: Clippy all features
        run: cargo clippy --locked --all-targets --all-features

      - name: Documentation all features
        run: cargo doc --locked --no-deps --all-features

      - name: Compile benchmarks
        run: cargo bench --locked --no-run
