[package]
name = "matrical"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Anthony Gardner"]
description = "Checked matrix selection and transformation with typed borrowing views and versioned snapshots."
license = "MIT"
repository = "https://github.com/Gardlok/Matrical"
readme = "README.md"
keywords = ["matrix", "selection", "transformation"]
categories = ["data-structures"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "src/**",
    "examples/**",
    "benches/**",
    "docs/getting-started.md",
    "docs/interchange.md",
    "docs/api-stability.md",
]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
ndarray = "0.15.3"
crossbeam = "0.8.2"
serde = { version = "=1.0.229", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "=0.7.0", default-features = false, features = ["cargo_bench_support"] }
serde_json = "=1.0.151"

[[example]]
name = "r7_snapshot"
required-features = ["serde"]

[[bench]]
name = "r6_selection"
harness = false

[[bench]]
name = "r6_transform"
harness = false
