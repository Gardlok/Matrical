[package]
name = "matrical"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Anthony Gardner"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
ndarray = "0.15.3"
crossbeam = "0.8.2"
serde = { version = "=1.0.229", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "=0.7.0", default-features = false, features = ["cargo_bench_support"] }
serde_json = "=1.0.151"

[[example]]
name = "r7_snapshot"
required-features = ["serde"]

[[bench]]
name = "r6_selection"
harness = false

[[bench]]
name = "r6_transform"
harness = false
